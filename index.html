    <!--
      Applies the stored/OS theme before the bundle loads, so the first paint is
      never the wrong colour. Keep in sync with src/i18n/ThemeProvider.tsx.
    -->
    <script>
      ;(function () {
        try {
          var stored = window.localStorage.getItem('portfolio:theme')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) {
            meta.setAttribute('content', theme === 'dark' ? '#030303' : '#f6f7f5')
          }
        } catch (error) {
          /* No storage or no matchMedia: the light default from the CSS applies. */
        }
      })()
    </script>
